<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Esmae and the Thing That Didn’t Feel Right</title>

  <style>
    :root{
      --bg0:#120c0a;
      --bg1:#1b130f;
      --card: rgba(20,14,12,.85);
      --text:#fbf7f2;
      --soft:#d5c6b6;
      --border:rgba(255,255,255,.12);
      --shadow: 0 12px 40px rgba(0,0,0,.55);
      --radius: 18px;
      --font: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    html, body{
      height:100%;
      margin:0;
      overflow:hidden;
      font-family:var(--font);
      color:var(--text);
    }

    body{
      background:
        radial-gradient(900px 600px at 15% 20%, rgba(255,175,120,.18), transparent 60%),
        radial-gradient(800px 520px at 85% 75%, rgba(255,210,140,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      display:flex;
      justify-content:center;
      padding:14px;
      box-sizing:border-box;
    }

    .card{
      width:100%;
      max-width:900px;
      height:100%;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    header{
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      font-size:13px;
      color:var(--soft);
    }

    .body{
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .page{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      padding:20px;
      gap:10px;
      font-size:22px;
      line-height:1.5;
      text-align:left;
    }

    .page.center{
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    .image{
      width:100%;
      max-height:40%;
      object-fit:cover;
      border-radius:14px;
      margin-top:14px;
    }

    footer{
      display:flex;
      justify-content:space-between;
      padding:14px 16px;
      border-top:1px solid var(--border);
    }

    button{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.2);
      color:var(--text);
      padding:10px 14px;
      border-radius:12px;
      font-weight:700;
      font-size:14px;
    }

    button:disabled{
      opacity:.4;
    }
  </style>
</head>
<body>

<div class="card">
  <header id="header">Page 1</header>

  <div class="body">
    <div id="page" class="page"></div>
  </div>

  <footer>
    <button id="back">Back</button>
    <button id="next">Next</button>
  </footer>
</div>

<script>
  // Adjust paths if your images are not in /images
  const IMG = {
    cover: "images/cover.png",
    cat: "images/scene-cat.png",
    chaos: "images/scene-chaos.png",
    think: "images/scene-thinking.png",
    creature: "images/scene-creature.png",
    wolf: "images/scene-wolf.png",
    end: "images/scene-ending.png"
  };

  const pages = [
    {
      center: true,
      text: [
        "ESMAE AND THE THING THAT DIDN’T FEEL RIGHT",
        "A little story for Esmae.",
        "Tap next to begin."
      ],
      img: IMG.cover
    },
    {
      text: [
        "Esmae could tell when something was weird.",
        "Not monster weird.",
        "More like something doesn’t feel right weird."
      ]
    },
    {
      text: [
        "The city was loud and bright.",
        "Everyone else was smiling.",
        "Esmae squinted. That never meant good news."
      ]
    },
    {
      text: [
        "A cat sat on a wall.",
        "It didn’t blink.",
        "Then it smiled."
      ],
      img: IMG.cat
    },
    {
      text: [
        "Things started going wrong.",
        "A balloon popped.",
        "A pigeon stole a hat.",
        "Esmae folded her arms. Yep. Weird."
      ],
      img: IMG.chaos
    },
    {
      text: [
        "Esmae didn’t panic.",
        "She watched.",
        "Her brain joined dots like a secret game."
      ],
      img: IMG.think
    },
    {
      text: [
        "Inside the music hall, shadows giggled.",
        "One small creature hovered, pretending to be scary."
      ],
      img: IMG.creature
    },
    {
      text: [
        "You’re not bad, Esmae said.",
        "You’re just lonely."
      ],
      img: IMG.wolf
    },
    {
      text: [
        "When they left, the city felt calm again.",
        "The cat blinked normally.",
        "Much better."
      ],
      img: IMG.end
    }
  ];

  let i = 0;
  const pageEl = document.getElementById("page");
  const header = document.getElementById("header");
  const back = document.getElementById("back");
  const next = document.getElementById("next");

  function render(){
    const p = pages[i];
    pageEl.className = "page" + (p.center ? " center" : "");
    pageEl.innerHTML = "";

    p.text.forEach(line => {
      const d = document.createElement("div");
      d.textContent = line;
      pageEl.appendChild(d);
    });

    if (p.img){
      const img = document.createElement("img");
      img.src = p.img;
      img.className = "image";
      pageEl.appendChild(img);
    }

    header.textContent = `Page ${i + 1} of ${pages.length}`;
    back.disabled = i === 0;
    next.disabled = i === pages.length - 1;
  }

  back.onclick = () => { if (i > 0) { i--; render(); } };
  next.onclick = () => { if (i < pages.length - 1) { i++; render(); } };

  render();
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Esmae and the Thing That Didn’t Feel Right</title>

  <style>
    :root{
      --bg0:#120c0a;
      --bg1:#1b130f;
      --card: rgba(20,14,12,.88);
      --text:#fbf7f2;
      --soft:#d5c6b6;
      --border:rgba(255,255,255,.12);
      --shadow: 0 12px 40px rgba(0,0,0,.55);
      --radius: 18px;
      --font: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    html, body{
      height:100%;
      margin:0;
      overflow:hidden; /* no scrolling anywhere */
      font-family:var(--font);
      color:var(--text);
    }

    body{
      background:
        radial-gradient(900px 600px at 15% 20%, rgba(255,175,120,.18), transparent 60%),
        radial-gradient(800px 520px at 85% 75%, rgba(255,210,140,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      display:flex;
      justify-content:center;
      padding:14px;
      box-sizing:border-box;
    }

    .card{
      width:100%;
      max-width:920px;
      height:100%;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    header{
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      color:var(--soft);
      font-size:13px;
      background: rgba(0,0,0,.10);
    }

    .body{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      padding:14px 16px;
      box-sizing:border-box;
      gap:12px;
    }

    .panel{
      flex:1;
      min-height:0;
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      overflow:hidden;
      background: rgba(0,0,0,.18);
      display:flex;
      flex-direction:column;
    }

    /* Text is TOP aligned, centered across the page */
    .text{
      flex: 0 0 auto;
      padding:16px 16px 10px 16px;
      display:flex;
      flex-direction:column;
      align-items:center;     /* center across */
      justify-content:flex-start; /* top */
      gap:10px;
      text-align:center;
      font-size:22px;
      line-height:1.5;
      letter-spacing:.2px;
    }

    .text.compact{ gap:8px; }
    .text h2{
      margin:0;
      font-size:26px;
      line-height:1.2;
      letter-spacing:.4px;
    }

    .text p{ margin:0; }

    /* Image area takes remaining space and shows the WHOLE picture */
    .imgWrap{
      flex: 1 1 auto;
      min-height:0;
      padding:12px 12px 14px 12px;
      border-top:1px solid rgba(255,255,255,.10);
      display:none;
    }

    .frame{
      width:100%;
      height:100%;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    img.storyImg{
      width:100%;
      height:100%;
      object-fit: contain;     /* KEY: no cropping */
      object-position: center; /* always centered */
      display:block;
    }

    .hint{
      color:var(--soft);
      font-size:13px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      padding:0 2px;
    }

    footer{
      display:flex;
      justify-content:space-between;
      padding:14px 16px;
      border-top:1px solid var(--border);
      background: rgba(0,0,0,.08);
    }

    button{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.2);
      color:var(--text);
      padding:10px 14px;
      border-radius:12px;
      font-weight:800;
      font-size:14px;
      white-space:nowrap;
      cursor:pointer;
    }
    button:disabled{ opacity:.4; cursor:not-allowed; }

    /* Tap zones so you can turn pages without hitting buttons */
    .tapZone{
      position:absolute;
      left:0; right:0;
      top:60px;
      bottom:68px;
      display:flex;
      z-index:5;
      pointer-events:none;
    }
    .tapHalf{
      width:50%;
      pointer-events:auto;
    }
  </style>
</head>

<body>
  <div class="card" style="position:relative;">
    <div class="tapZone" aria-hidden="true">
      <div class="tapHalf" id="tapLeft"></div>
      <div class="tapHalf" id="tapRight"></div>
    </div>

    <header>
      <div id="pageLabel">Page 1</div>
      <div style="opacity:.85;">Tap sides to turn pages</div>
    </header>

    <div class="body">
      <div class="panel">
        <div class="text" id="text"></div>

        <div class="imgWrap" id="imgWrap">
          <div class="frame">
            <img class="storyImg" id="img" alt="Illustration" />
          </div>
        </div>
      </div>

      <div class="hint">
        <span>Left = back</span>
        <span>Right = next</span>
      </div>
    </div>

    <footer>
      <button id="backBtn">Back</button>
      <button id="nextBtn">Next</button>
    </footer>
  </div>

<script>
  // If your images are in the repo root, remove "images/" from these paths.
  const IMG = {
    cover:    "images/cover.png",
    cat:      "images/scene-cat.png",
    chaos:    "images/scene-chaos.png",
    think:    "images/scene-thinking.png",
    creature: "images/scene-creature.png",
    wolf:     "images/scene-wolf.png",
    end:      "images/scene-ending.png"
  };

  // Full story pages + splits so images have room.
  // Split 1: Cat beat -> text page then image page
  // Split 2: Ending beat -> text page then image page
  const pages = [
    // 1 Cover (centred title, image visible)
    { title: true, lines: ["ESMAE AND THE THING THAT DIDN’T FEEL RIGHT", "A little story for Esmae.", "Tap next to begin."], img: IMG.cover },

    // 2
    { lines: ["Esmae could tell when something was weird.",
              "Not “monster in the cupboard” weird.",
              "More like… “Why is everyone suddenly acting silly?” weird.",
              "Her belly did a little ping.",
              "That was her “something’s off” alarm."], img: null },

    // 3
    { lines: ["The city was bright.",
              "The signs were shiny.",
              "The music was loud.",
              "Nova said, “Best day ever!”",
              "Luna said, “Nothing can ruin this!”",
              "Esmae squinted. “That sentence is risky.”"], img: null },

    // 4
    { lines: ["They walked past a shop with a huge smiley face on the window.",
              "The shopkeeper waved way too much.",
              "Like his arm was trying to escape.",
              "Esmae whispered, “Why is he waving like that?”",
              "Nova shrugged. “He’s friendly.”",
              "Esmae muttered, “Or he’s hiding something.”"], img: null },

    // 5 (split part A: text only)
    { lines: ["A cat sat on a wall.",
              "It stared at them.",
              "It didn’t blink.",
              "It didn’t move.",
              "Then it smiled.",
              "Cats should not smile like that."], img: null },

    // 6 (split part B: image page for the cat)
    { lines: ["Esmae stopped walking.", "Everyone else kept going."], img: IMG.cat },

    // 7
    { lines: ["A balloon popped behind them.",
              "BANG!",
              "A man dropped his chips.",
              "A kid tripped over nothing.",
              "Two friends started arguing about… a sandwich.",
              "A sandwich!",
              "Esmae folded her arms. “Yep. Weird.”"], img: IMG.chaos },

    // 8
    { lines: ["Nova huffed. “Esmae, not everything is a clue.”",
              "Esmae pointed. “That lamppost is leaning.”",
              "Nova looked. “It’s a lamppost.”",
              "Esmae pointed again. “That dog is walking backwards.”",
              "Luna blinked. “Okay… that is odd.”"], img: null },

    // 9
    { lines: ["Esmae’s eyes moved fast.",
              "She didn’t just look.",
              "She noticed.",
              "Little things.",
              "Tiny things.",
              "Things that didn’t match.",
              "Her brain started connecting dots like it was playing a game."], img: IMG.think },

    // 10
    { lines: ["Maybe it was the shop.",
              "Maybe it was the cat.",
              "Maybe it was… the balloons?",
              "Esmae gasped. “I KNOW!”",
              "Everyone leaned in.",
              "Esmae said, “It’s the ice cream van!”"], img: null },

    // 11
    { lines: ["Nova frowned. “Why?”",
              "Esmae whispered, dramatic, “Because the jingle is slightly out of tune.”",
              "They stared at her.",
              "Esmae added, “That matters.”"], img: null },

    // 12
    { lines: ["They followed the ice cream van.",
              "Esmae felt proud.",
              "Then the van stopped.",
              "The driver hopped out.",
              "He was normal.",
              "He was boring.",
              "He offered them a napkin.",
              "Esmae blinked. “Oh.”",
              "Nova smirked. “Pattern… not there?”",
              "Esmae grinned back. “Testing a theory.”"], img: null },

    // 13
    { lines: ["More chaos started.",
              "Shoelaces untied themselves.",
              "A door kept slamming.",
              "A pigeon stole someone’s hat and wore it like a king.",
              "The cat was back.",
              "Still smiling.",
              "It hopped down and strolled right into the music hall.",
              "Esmae pointed. “THAT. Follow THAT.”"], img: null },

    // 14
    { lines: ["Inside the music hall, shadows bounced on the walls.",
              "But not like normal shadows.",
              "These shadows giggled.",
              "A small creature zipped across the ceiling like a naughty thought.",
              "Nova reached for her weapon.",
              "Luna stepped forward, ready to sing a battle note.",
              "Esmae held up her hand. “Wait.”"], img: IMG.creature },

    // 15
    { lines: ["The creature stopped.",
              "It wasn’t huge.",
              "It wasn’t terrifying.",
              "It looked more like a messy puff of smoke with elbows.",
              "It wore the cat’s smile like a mask.",
              "Esmae said, “You’re not trying to destroy things.”",
              "The creature’s smile flickered.",
              "“You’re trying to be noticed.”"], img: null },

    // 16 (talk moment uses your wolf image)
    { lines: ["The creature snapped, “NO I’M NOT!”",
              "But its voice wobbled at the end.",
              "Esmae stepped closer.",
              "Not scared.",
              "Just… serious.",
              "“I know this one,” she said quietly.",
              "“People do annoying stuff when they feel invisible.”",
              "The creature’s shoulders drooped.",
              "“I just wanted someone to look at me,” it mumbled."], img: IMG.wolf },

    // 17
    { lines: ["Nova whispered, “So… we don’t fight?”",
              "Esmae looked at the creature. “We fix.”",
              "She pointed at the mess. “You help clean up.”",
              "The creature sniffed. “I don’t know how.”",
              "Esmae said, “Good news. I’m bossy.”",
              "The creature gave a tiny laugh.",
              "They worked together.",
              "Doors stopped slamming.",
              "Shoes stayed tied.",
              "The pigeon gave the hat back (grumpily)."], img: null },

    // 18 (split ending A: text)
    { lines: ["When they walked outside, the air felt calmer.",
              "Nova nudged Esmae. “How did you know?”",
              "Esmae shrugged like it was no big deal.",
              "“I watch. I listen. I feel when something’s off.”",
              "She smiled, fierce and lovable.",
              "“And sometimes I connect patterns that aren’t there.”",
              "Nova raised an eyebrow.",
              "Esmae grinned. “But I’m usually right eventually.”"], img: null },

    // 19 (split ending B: image page + short closure)
    { lines: ["The cat blinked.", "Finally.", "Esmae nodded. “Much better.”", "THE END"], img: IMG.end }
  ];

  const STORAGE_KEY = "esmae_story_page_v5";

  const textEl = document.getElementById("text");
  const imgWrap = document.getElementById("imgWrap");
  const imgEl = document.getElementById("img");
  const pageLabel = document.getElementById("pageLabel");

  const backBtn = document.getElementById("backBtn");
  const nextBtn = document.getElementById("nextBtn");
  const tapLeft = document.getElementById("tapLeft");
  const tapRight = document.getElementById("tapRight");

  let idx = 0;

  function loadIdx(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const n = raw ? parseInt(raw, 10) : 0;
      return Number.isFinite(n) ? Math.max(0, Math.min(pages.length - 1, n)) : 0;
    }catch(e){ return 0; }
  }

  function saveIdx(){
    try{ localStorage.setItem(STORAGE_KEY, String(idx)); }catch(e){}
  }

  function render(){
    const p = pages[idx];

    // Text
    textEl.className = "text" + (p.title ? " compact" : "");
    textEl.innerHTML = "";

    if (p.title){
      const h = document.createElement("h2");
      h.textContent = p.lines[0];
      textEl.appendChild(h);

      for (let i = 1; i < p.lines.length; i++){
        const para = document.createElement("p");
        para.textContent = p.lines[i];
        textEl.appendChild(para);
      }
    } else {
      p.lines.forEach(line => {
        const para = document.createElement("p");
        para.textContent = line;
        textEl.appendChild(para);
      });
    }

    // Image
    if (p.img){
      imgWrap.style.display = "block";
      imgEl.src = p.img;
      imgEl.alt = "Illustration for page " + (idx + 1);
    } else {
      imgWrap.style.display = "none";
      imgEl.removeAttribute("src");
      imgEl.removeAttribute("alt");
    }

    // Labels + buttons
    pageLabel.textContent = `Page ${idx + 1} of ${pages.length}`;
    backBtn.disabled = idx === 0;
    nextBtn.disabled = idx === pages.length - 1;

    saveIdx();
  }

  function next(){ if (idx < pages.length - 1){ idx++; render(); } }
  function back(){ if (idx > 0){ idx--; render(); } }

  backBtn.addEventListener("click", back);
  nextBtn.addEventListener("click", next);
  tapLeft.addEventListener("click", back);
  tapRight.addEventListener("click", next);

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") back();
  });

  // Start
  idx = loadIdx();
  render();
</script>
</body>
</html>

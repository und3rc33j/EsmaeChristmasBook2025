<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Esmae and the Thing That Didn’t Feel Right</title>

  <style>
    :root{
      --bg0:#120c0a;
      --bg1:#1b130f;
      --card: rgba(20,14,12,.88);
      --text:#fbf7f2;
      --soft:#d5c6b6;
      --border:rgba(255,255,255,.12);
      --shadow: 0 12px 40px rgba(0,0,0,.55);
      --radius: 18px;
      --font: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    html, body{
      height:100%;
      margin:0;
      overflow:hidden;
      font-family:var(--font);
      color:var(--text);
    }

    body{
      background:
        radial-gradient(900px 600px at 15% 20%, rgba(255,175,120,.18), transparent 60%),
        radial-gradient(800px 520px at 85% 75%, rgba(255,210,140,.12), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      display:flex;
      justify-content:center;
      padding:14px;
      box-sizing:border-box;
    }

    .card{
      width:100%;
      max-width:920px;
      height:100%;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }

    header{
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:13px;
      color:var(--soft);
      background: rgba(0,0,0,.10);
    }

    .body{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      padding:14px 16px;
      gap:12px;
    }

    .panel{
      flex:1;
      min-height:0;
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      overflow:hidden;
      background: rgba(0,0,0,.18);
      display:flex;
      flex-direction:column;
    }

    /* TEXT: top aligned, centred across page */
    .text{
      flex:0 0 auto;
      padding:16px 16px 10px 16px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      text-align:center;
      font-size:22px;
      line-height:1.5;
      letter-spacing:.2px;
    }

    .text h2{
      margin:0;
      font-size:26px;
      line-height:1.2;
    }

    @media (max-width: 480px){
  .text{
    font-size:18px;
    line-height:1.45;
  }

  .text h2{
    font-size:22px;
  }
}

    @media (max-width: 360px){
  .text{
    font-size:17px;
    line-height:1.4;
  }

  .text h2{
    font-size:20px;
  }
}



    .text p{ margin:0; }

    /* IMAGE AREA: fills remaining space, no cropping */
    .imgWrap{
      flex:1 1 auto;
      min-height:0;
      padding:12px 12px 14px 12px;
      border-top:1px solid rgba(255,255,255,.10);
      display:none;
    }

    .frame{
      width:100%;
      height:100%;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    img.storyImg{
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center;
      display:block;
    }

    footer{
      display:flex;
      justify-content:space-between;
      padding:14px 16px;
      border-top:1px solid var(--border);
      background: rgba(0,0,0,.08);
    }

    button{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.2);
      color:var(--text);
      padding:10px 14px;
      border-radius:12px;
      font-weight:800;
      font-size:14px;
      cursor:pointer;
    }
    button:disabled{ opacity:.4; cursor:not-allowed; }

    /* Tap zones for easy page turning */
    .tapZone{
      position:absolute;
      left:0; right:0;
      top:56px;
      bottom:64px;
      display:flex;
      z-index:5;
    }
    .tapHalf{
      width:50%;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="tapZone" aria-hidden="true">
      <div class="tapHalf" id="tapLeft"></div>
      <div class="tapHalf" id="tapRight"></div>
    </div>

    <header>
      <div id="pageLabel">Page 1</div>
      <div>Tap sides to turn pages</div>
    </header>

    <div class="body">
      <div class="panel">
        <div class="text" id="text"></div>

        <div class="imgWrap" id="imgWrap">
          <div class="frame">
            <img class="storyImg" id="img" alt="Illustration" />
          </div>
        </div>
      </div>
    </div>

    <footer>
      <button id="backBtn">Back</button>
      <button id="nextBtn">Next</button>
    </footer>
  </div>

<script>
  const IMG = {
    cover:    "images/cover.png",
    cat:      "images/scene-cat.png",
    chaos:    "images/scene-chaos.png",
    think:    "images/scene-thinking.png",
    creature: "images/scene-creature.png",
    wolf:     "images/scene-wolf.png",
    end:      "images/scene-ending.png"
  };

  const pages = [
    { title:true, lines:["ESMAE AND THE THING THAT DIDN’T FEEL RIGHT","A little story for Esmae.","Tap next to begin."], img:IMG.cover },

    { lines:["Esmae could tell when something was weird.","Not “monster in the cupboard” weird.","More like… “Why is everyone suddenly acting silly?” weird.","Her belly did a little ping.","That was her “something’s off” alarm."], img:null },

    { lines:["The city was bright.","The signs were shiny.","The music was loud.","Nova said, “Best day ever!”","Luna said, “Nothing can ruin this!”","Esmae squinted. “That sentence is risky.”"], img:null },

    { lines:["They walked past a shop with a huge smiley face on the window.","The shopkeeper waved way too much.","Like his arm was trying to escape.","Esmae whispered, “Why is he waving like that?”","Nova shrugged. “He’s friendly.”","Esmae muttered, “Or he’s hiding something.”"], img:null },

    // Page 5 – CAT REVEAL WITH IMAGE
    { lines:["A cat sat on a wall.","It stared at them.","It didn’t blink.","It didn’t move.","Then it smiled.","Cats should not smile like that."], img:IMG.cat },

    // Page 6 – FOLLOW UP TEXT ONLY
    { lines:["Esmae stopped walking.","Everyone else kept going."], img:null },

    { lines:["A balloon popped behind them.","BANG!","A man dropped his chips.","A kid tripped over nothing.","Two friends started arguing about… a sandwich.","A sandwich!","Esmae folded her arms. “Yep. Weird.”"], img:IMG.chaos },

    { lines:["Nova huffed. “Esmae, not everything is a clue.”","Esmae pointed. “That lamppost is leaning.”","Nova looked. “It’s a lamppost.”","Esmae pointed again. “That dog is walking backwards.”","Luna blinked. “Okay… that is odd.”"], img:null },

    { lines:["Esmae’s eyes moved fast.","She didn’t just look.","She noticed.","Little things.","Tiny things.","Things that didn’t match.","Her brain started connecting dots like it was playing a game."], img:IMG.think },

    { lines:["Maybe it was the shop.","Maybe it was the cat.","Maybe it was… the balloons?","Esmae gasped. “I KNOW!”","Everyone leaned in.","Esmae said, “It’s the ice cream van!”"], img:null },

    { lines:["Nova frowned. “Why?”","Esmae whispered, dramatic, “Because the jingle is slightly out of tune.”","They stared at her.","Esmae added, “That matters.”"], img:null },

    { lines:["They followed the ice cream van.","Esmae felt proud.","Then the van stopped.","The driver hopped out.","He was normal.","He was boring.","He offered them a napkin.","Esmae blinked. “Oh.”","Nova smirked. “Pattern… not there?”","Esmae grinned back. “Testing a theory.”"], img:null },

    { lines:["More chaos started.","Shoelaces untied themselves.","A door kept slamming.","A pigeon stole someone’s hat and wore it like a king.","The cat was back.","Still smiling.","It hopped down and strolled right into the music hall.","Esmae pointed. “THAT. Follow THAT.”"], img:null },

    { lines:["Inside the music hall, shadows bounced on the walls.","But not like normal shadows.","These shadows giggled.","A small creature zipped across the ceiling like a naughty thought.","Nova reached for her weapon.","Luna stepped forward, ready to sing a battle note.","Esmae held up her hand. “Wait.”"], img:IMG.creature },

    { lines:["The creature stopped.","It wasn’t huge.","It wasn’t terrifying.","It looked more like a messy puff of smoke with elbows.","It wore the cat’s smile like a mask.","Esmae said, “You’re not trying to destroy things.”","The creature’s smile flickered.","“You’re trying to be noticed.”"], img:null },

    { lines:["The creature snapped, “NO I’M NOT!”","But its voice wobbled at the end.","Esmae stepped closer.","Not scared.","Just… serious.","“I know this one,” she said quietly.","“People do annoying stuff when they feel invisible.”","The creature’s shoulders drooped.","“I just wanted someone to look at me,” it mumbled."], img:IMG.wolf },

    { lines:["Nova whispered, “So… we don’t fight?”","Esmae looked at the creature. “We fix.”","She pointed at the mess. “You help clean up.”","The creature sniffed. “I don’t know how.”","Esmae said, “Good news. I’m bossy.”","The creature gave a tiny laugh.","They worked together.","Doors stopped slamming.","Shoes stayed tied.","The pigeon gave the hat back (grumpily)."], img:null },

    { lines:["When they walked outside, the air felt calmer.","Nova nudged Esmae. “How did you know?”","Esmae shrugged like it was no big deal.","“I watch. I listen. I feel when something’s off.”","She smiled, fierce and lovable.","“And sometimes I connect patterns that aren’t there.”","Nova raised an eyebrow.","Esmae grinned. “But I’m usually right eventually.”"], img:null },

    { lines:["The cat blinked.","Finally.","Esmae nodded. “Much better.”","THE END"], img:IMG.end }
  ];

  let idx = 0;
  const textEl = document.getElementById("text");
  const imgWrap = document.getElementById("imgWrap");
  const imgEl = document.getElementById("img");
  const pageLabel = document.getElementById("pageLabel");
  const backBtn = document.getElementById("backBtn");
  const nextBtn = document.getElementById("nextBtn");
  const tapLeft = document.getElementById("tapLeft");
  const tapRight = document.getElementById("tapRight");

  function render(){
    const p = pages[idx];
    textEl.innerHTML = "";

    if (p.title){
      const h = document.createElement("h2");
      h.textContent = p.lines[0];
      textEl.appendChild(h);
      for (let i=1;i<p.lines.length;i++){
        const d=document.createElement("p");
        d.textContent=p.lines[i];
        textEl.appendChild(d);
      }
    } else {
      p.lines.forEach(l=>{
        const d=document.createElement("p");
        d.textContent=l;
        textEl.appendChild(d);
      });
    }

    if (p.img){
      imgWrap.style.display="block";
      imgEl.src=p.img;
    } else {
      imgWrap.style.display="none";
      imgEl.removeAttribute("src");
    }

    pageLabel.textContent=`Page ${idx+1} of ${pages.length}`;
    backBtn.disabled = idx===0;
    nextBtn.disabled = idx===pages.length-1;
  }

  function next(){ if(idx<pages.length-1){ idx++; render(); } }
  function back(){ if(idx>0){ idx--; render(); } }

  backBtn.onclick=back;
  nextBtn.onclick=next;
  tapLeft.onclick=back;
  tapRight.onclick=next;

  render();
</script>
</body>
</html>
